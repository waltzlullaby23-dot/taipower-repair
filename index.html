      state.moveBlocked = true;
      state.initialRopePrompted = true;
      log('第三個腳踏釘已踩穩。', '按 Q 固定母繩並接上制動器後，再繼續交叉握踏登桿。');
      updateUI();
      return;
    }
    if (state.moving < 0 && state.height < state.ropeAnchor - 1.35) {
      state.ropeAnchors = [Math.max(0.9, state.height + 0.72), Math.max(1.0, state.height + 1.08)];
      state.activeRope = 1;
      state.ropeAnchor = state.ropeAnchors[1];
    }
    updateRopeGeometry();
  };

  let camYaw = 0.72;
  let camPitch = 0.22;
  let camDistance = 14.8;
  let viewMode = 'overview';
  let dragging = false;
  let lastPointer = { x: 0, y: 0 };
  el.canvas.addEventListener('pointerdown', event => {
    dragging = true;
    lastPointer = { x: event.clientX, y: event.clientY };
    el.canvas.setPointerCapture(event.pointerId);
  });
  el.canvas.addEventListener('pointermove', event => {
    if (!dragging) return;
    camYaw -= (event.clientX - lastPointer.x) * 0.007;
    camPitch = THREE.MathUtils.clamp(camPitch + (event.clientY - lastPointer.y) * 0.005, -0.1, 0.72);
    lastPointer = { x: event.clientX, y: event.clientY };
  });
  el.canvas.addEventListener('pointerup', () => { dragging = false; });
  el.canvas.addEventListener('pointercancel', () => { dragging = false; });
  el.canvas.addEventListener('wheel', event => {
    event.preventDefault();
    camDistance = THREE.MathUtils.clamp(camDistance + event.deltaY * 0.012, 4.2, 23);
  }, { passive: false });

  const bindHold = (button, value) => {
    button.addEventListener('pointerdown', event => {
      event.preventDefault();
      button.setPointerCapture(event.pointerId);
      setMoving(value);
    });
    button.addEventListener('pointerup', () => setMoving(0));
    button.addEventListener('pointercancel', () => setMoving(0));
    button.addEventListener('pointerleave', event => {
      if (event.buttons === 0) setMoving(0);
    });
  };
  bindHold(el.up, 1);
  bindHold(el.down, -1);
  el.rope.addEventListener('click', attachRope);
  el.audio.addEventListener('click', toggleAudio);
  el.view.addEventListener('click', () => {
    viewMode = viewMode === 'overview' ? 'equipment' : viewMode === 'equipment' ? 'worker' : 'overview';
    if (viewMode === 'equipment') {
      camDistance = 7.1;
      camPitch = 0.08;
      camYaw = 0.92;
      el.view.textContent = '人物近景';
    } else if (viewMode === 'worker') {
      camDistance = 5.2;
      camPitch = 0.06;
      camYaw = 2.2;
      el.view.textContent = '返回設備全景';
    } else {
      camDistance = 14.8;
      camPitch = 0.22;
      camYaw = 0.72;
      el.view.textContent = '設備近景';
    }
    el.view.setAttribute('aria-pressed', String(viewMode !== 'overview'));
  });
  el.reset.addEventListener('click', reset);
  el.mode.addEventListener('change', reset);
  el.voltage.addEventListener('change', reset);
  el.fault.addEventListener('change', reset);
  el.actions.forEach(button => button.addEventListener('click', () => performAction(button.dataset.action)));

  const movementKeys = new Set(['w', 's', 'arrowup', 'arrowdown']);
  window.addEventListener('keydown', event => {
    if (!root.isConnected || ['SELECT', 'INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;
    const key = event.key.toLowerCase();
    if (movementKeys.has(key)) {
      event.preventDefault();
      setMoving(key === 'w' || key === 'arrowup' ? 1 : -1);
    }
    if (key === 'q' && !event.repeat) {
      event.preventDefault();
      attachRope();
    }
  });
  window.addEventListener('keyup', event => {
    if (movementKeys.has(event.key.toLowerCase())) setMoving(0);
  });

  const resize = () => {
    const rect = el.stage.getBoundingClientRect();
    const width = Math.max(320, rect.width);
    const height = Math.max(360, rect.height);
    renderer.setSize(width, height, false);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
  };
  const resizeObserver = new ResizeObserver(resize);
  resizeObserver.observe(el.stage);
  resize();

  let lastTime = performance.now();
  let lastRenderTime = 0;
  let sceneVisible = true;
  const visibilityObserver = window.IntersectionObserver
    ? new IntersectionObserver(entries => {
        sceneVisible = entries[0]?.isIntersecting !== false;
      })
    : { observe() {}, disconnect() {} };
  visibilityObserver.observe(root);
  const animate = time => {
    if (!root.isConnected) {
      if (musicTimer) clearInterval(musicTimer);
      resizeObserver.disconnect();
      visibilityObserver.disconnect();
      renderer.dispose();
      return;
    }
    requestAnimationFrame(animate);
    if (!sceneVisible || document.hidden || time - lastRenderTime < 30) return;
    lastRenderTime = time;
    const delta = Math.min(0.05, (time - lastTime) / 1000);
    lastTime = time;
    onMoveFrame(delta);
    updateWorker(time);
    updateActionAnimation(time);
    const workerView = viewMode === 'worker';
    const equipmentView = viewMode === 'equipment';
    const targetY = workerView ? state.height + 0.28 : equipmentView ? 7.85 : Math.max(4.7, state.height + 1.15);
    const targetZ = workerView ? 0.72 : equipmentView ? -0.1 : 0;
    const cosPitch = Math.cos(camPitch);
    camera.position.set(
      Math.sin(camYaw) * camDistance * cosPitch + (workerView ? 1.55 : 0),
      targetY + Math.sin(camPitch) * camDistance,
      targetZ + Math.cos(camYaw) * camDistance * cosPitch
    );
    camera.lookAt(0, targetY, targetZ);
    if (time < arcUntil) {
      arcLight.intensity = 3.5 * Math.max(0, (arcUntil - time) / 720);
      arcGroup.children.forEach((child, index) => {
        if (index > 0 && child.material) child.material.opacity = Math.max(0, (arcUntil - time) / 720);
      });
    } else if (arcGroup.visible) {
      arcGroup.visible = false;
      arcLight.intensity = 0;
    }
    if (musicEnabled && Math.floor(time / 400) !== Math.floor((time - delta * 1000) / 400)) updateUI();
    renderer.render(scene, camera);
    if (!webglReady) {
      webglReady = true;
      el.canvas.classList.add('is-ready');
      if (el.fallback) el.fallback.classList.add('is-hidden');
      fallbackObserver.disconnect();
    }
  };

  reset();
  requestAnimationFrame(animate);
  };

  const showLoadError = () => {
    const root = document.getElementById('taipower-cross-limb-climbing-sim');
    if (!root) return;
    const log = root.querySelector('#tp3-log');
    const main = root.querySelector('#tp3-log-main');
    const detail = root.querySelector('#tp3-log-detail');
    if (log) log.classList.add('is-danger');
    if (main) main.textContent = '3D 引擎連線較慢，操作介面仍可使用。';
    if (detail) detail.textContent = '引擎載入後場景會自動出現；也可重新開啟此畫面。';
  };

  const launch = () => window.setTimeout(() => {
    try {
      startTaipowerSimulation();
    } catch {
      showLoadError();
    }
  }, 600);
  if (window.THREE) {
    launch();
    return;
  }

  window.setTimeout(() => {
    if (window.THREE) {
      launch();
      return;
    }
    const threeLoader = document.createElement('script');
    threeLoader.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
    threeLoader.async = true;
    threeLoader.crossOrigin = 'anonymous';
    const slowTimer = window.setTimeout(showLoadError, 12000);
    threeLoader.onload = () => {
      window.clearTimeout(slowTimer);
      launch();
    };
    threeLoader.onerror = () => {
      window.clearTimeout(slowTimer);
      showLoadError();
    };
    document.head.appendChild(threeLoader);
  }, 600);
})();
</script>

<script src="https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js"></script>
<script src="https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js"></script>
<script>
(() => {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set(["top", "right", "bottom", "left"]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =>
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest("[data-tooltip]")
      : null;
  const containsTarget = (trigger, target) =>
    target?.nodeType != null && trigger.contains(target);
  const getContent = (trigger) =>
    trigger.getAttribute("data-tooltip")?.trim() ?? "";
  const getPlacement = (trigger) => {
    const placement = trigger.getAttribute("data-tooltip-placement");
    return tooltipPlacements.has(placement) ? placement : "top";
  };
  const getTooltip = () => {
    if (tooltip == null) {
      tooltip = document.createElement("div");
      tooltip.id = tooltipId;
      tooltip.className = "tooltip";
      tooltip.setAttribute("role", "tooltip");
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) => {
    const ids = new Set(
      (trigger.getAttribute("aria-describedby") ?? "")
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute("aria-describedby");
    } else {
      trigger.setAttribute("aria-describedby", [...ids].join(" "));
    }
  };
  const clearOpenTimeout = () => {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) => {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) => {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              "--tooltip-available-width",
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              "--tooltip-available-height",
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: "fixed",
    })
      .then(({ x, y }) => {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = "visible";
      })
      .catch(() => {
        if (activeTrigger === trigger && request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) => {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = "hidden";
    floating.style.transform = "translate(0, 0)";
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () => {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) => {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() < skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() => {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) => {
    if (event.pointerType === "touch") {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) => {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) => {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(":focus-visible")) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) => {
    if (event.key === "Escape") {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) => {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () => {
    closeTooltip(false);
    document.removeEventListener("pointerover", handlePointerOpen);
    document.removeEventListener("pointerout", handleLeave);
    document.removeEventListener("focusin", handleFocusIn);
    document.removeEventListener("focusout", handleLeave);
    document.removeEventListener("keydown", handleKeyDown);
    document.removeEventListener("contextmenu", handleContextMenu);
    tooltip = null;
  };

  document.addEventListener("pointerover", handlePointerOpen);
  document.addEventListener("pointerout", handleLeave);
  document.addEventListener("focusin", handleFocusIn);
  document.addEventListener("focusout", handleLeave);
  document.addEventListener("keydown", handleKeyDown);
  document.addEventListener("contextmenu", handleContextMenu);
  window.addEventListener("pagehide", destroy, { once: true });
})();
</script>
<script id="codex-visualization-lucide" async src="https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js"></script>
<script>
(() => {
  const initialize = () => {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById("codex-visualization-lucide")
    ?.addEventListener("load", initialize, { once: true });
})();
</script>
